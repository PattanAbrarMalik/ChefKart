name: ChefKart CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── 1. Quality & Lint Checks ─────────────────────────────────────────────
  audit:
    name: Security & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

  # ── 2. Automated Test Suite ──────────────────────────────────────────────
  test:
    name: Multi-Service Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/forms/requirements.txt

      - name: Run Core API Tests
        run: npm test

      - name: Run Flask Service Tests
        run: python -m unittest discover -s services/forms/tests -v

  # ── 3. Frontend Bundle Compilation ───────────────────────────────────────
  build-frontend:
    name: Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Frontend Bundle
        run: npm run build

  # ── 4. Container Build Verification ──────────────────────────────────────
  docker:
    name: Container Build & Health Validation
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Core Platform Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: chefkart/core:latest

      - name: Build Forms Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/forms
          file: ./services/forms/Dockerfile
          push: false
          tags: chefkart/forms:latest

