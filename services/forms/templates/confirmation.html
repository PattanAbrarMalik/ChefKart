{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="narrow confirmation">
  <p class="eyebrow">Details reviewed</p>
  <h1>{{ title }}</h1>
  <p class="intro">{{ description }}</p>
  <dl class="details">{% for label, value in details %}<div><dt>{{ label }}</dt><dd>{{ value }}</dd></div>{% endfor %}</dl>
  <p class="muted">{{ note }}</p>
  <a class="button" href="{{ back_url }}">Enter another</a>
  <a class="text-link" href="{{ url_for('home') }}">Back to kitchen desk</a>
</section>
{% endblock %}
