# ── Render Infrastructure as Code (Blueprint) ──────────────────────────────
# Deploy ChefKart to Render: https://render.com
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ── Core Platform (React 18 SPA + Express 4 API) ──────────────────────────
  - type: web
    name: chefkart-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DATA
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
