version: "3.9"

services:
  # ── Edge Reverse Proxy ───────────────────────────────────────────────────
  gateway:
    image: nginx:1.25-alpine
    container_name: chefkart-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
      forms:
        condition: service_started
    networks:
      - edge-network
      - internal-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Core Backend + React SPA ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chefkart-core
    restart: always
    expose:
      - "8000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      HOST: 0.0.0.0
      TRUST_PROXY: "true"
      MONGODB_URI: mongodb://mongodb:27017/chefkart
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable is required}
      SEED_DATA: "false"
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT_MS: 15000
    volumes:
      - app_data:/app/backend/data
    networks:
      - internal-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Flask Forms Microservice ─────────────────────────────────────────────
  forms:
    build:
      context: ./services/forms
      dockerfile: Dockerfile
    container_name: chefkart-forms-prod
    restart: always
    expose:
      - "5001"
    environment:
      FLASK_ENV: production
      CHEFKART_FLASK_PORT: 5001
      CHEFKART_FLASK_SECRET: ${FLASK_SECRET:-chefkart_production_secret_key_84920}
    volumes:
      - forms_data:/app/instance
    networks:
      - internal-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── MongoDB Production Instance ──────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: chefkart-db
    restart: always
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: chefkart
    networks:
      - internal-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

networks:
  edge-network:
    driver: bridge
  internal-network:
    internal: false

volumes:
  mongodb_data:
    driver: local
  app_data:
    driver: local
  forms_data:
    driver: local

